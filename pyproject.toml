[project]
name = "robowin"
version = "0.1.0"
description = "Agente de IA para day trade de WIN (B3) via MetaTrader 5 - v1 em simulacao"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0", "scipy>=1.14", "pandas>=2.2", "pyarrow>=17", "duckdb>=1.1",
  "pydantic>=2.8", "anthropic>=2.0", "openai>=3.0", "httpx>=0.27",
  "lightgbm>=4.5", "scikit-learn>=1.5", "statsmodels>=0.14",
  "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "pyzmq>=26",
  "exchange-calendars>=4.5", "tzdata",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
google = ["google-genai>=1.0"]
ollama = ["ollama>=0.4"]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "pytest-asyncio>=0.24"]

[project.scripts]
robowin = "robowin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robowin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
