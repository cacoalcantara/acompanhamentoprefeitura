name: ci
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python: ["3.12", "3.13"]}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -rfE
      - run: uv run python scripts/lint_mql4.py mql4/RobowinBridge.mq4
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev --extra mt5 --python 3.13
      - run: uv run pytest -rfE
      - run: uv run python scripts/conferir_constantes_mt5.py
      - run: uv run python -c "import MetaTrader5 as m; print(m.__version__); assert hasattr(m,'ACCOUNT_TRADE_MODE_DEMO') and hasattr(m,'TICK_FLAG_BUY')"
