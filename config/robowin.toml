[geral]
modo = "simulacao"          # nunca "real" nesta etapa
conta = "demo_mt5"          # interno | demo_mt5
dados = "dados_locais"
simbolo_base = "WIN"
# Espelha UM braco (id) na conta DEMO via gateway (decisao/espelho.py). Vazio = desligado (padrao).
# Exige conta = "demo_mt5", gateway no ar, conta demo zerada e SL em toda entrada; exclusivo com [mm].demo_mm.
espelhar = ""
# Limites de risco POR USUARIO e POR CONTA (risco/usuarios.py; docs/07-risco-e-operacao.md). Vazios = modo de arquivo
# unico (config/risco.toml, cuja aprovacao risco-v2 e PROVISORIA do titular, somente DEMO). Com usuario + conta, nucleo,
# gateway, espelho, MM e aceitacao usam SO os limites aprovados desse par; usuario novo comeca sem limites (bloqueado).
usuario = ""                  # ex.: "titular" (criado com `robowin usuario criar`)
conta_negociacao = ""         # PLATAFORMA:SERVIDOR:LOGIN, ex.: "mt5:CORRETORA-DEMO:123456"
usuarios = "config/usuarios"  # armazem de usuarios/contas (fora do git; relativo a raiz do projeto)

[ia]
orcamento_mensal_usd = 400
[ia.papeis.proponente]
modelo = "anthropic:claude-opus-5-5"
effort = "low"
[ia.papeis.revisor]
modelo = "openai:gpt-6.1-sol"
effort = "low"
[ia.papeis.classificador_nlp]
modelo = "anthropic:claude-haiku-5-5"
# Papeis do braco EXPERIMENTAL de debate (decisao/bracos/debate.py). So sao usados se houver um [[bracos]] com
# tipo = "debate" (desligado por padrao). Todos veem SO o dossie anonimizado: sem ferramentas e sem internet.
[ia.papeis.pesquisador]            # pesquisadores altista e baixista
modelo = "anthropic:claude-sonnet-5-5"
effort = "low"
[ia.papeis.debatedor_risco]        # debatedores de risco agressivo, neutro e conservador
modelo = "anthropic:claude-haiku-5-5"
[ia.papeis.sintetizador]           # decide depois do debate; cumpre o papel de proponente
modelo = "anthropic:claude-opus-5-5"
effort = "low"
[ia.papeis.reflexao]               # licao escrita DEPOIS do resultado liquidado (memoria reflexiva; [reflexao])
modelo = "anthropic:claude-haiku-5-5"

[decisao]
# Maquina do Tempo (avaliacao/maquina_do_tempo.py): probabilidades do plano proposto entregues ao REVISOR como
# evidencia (simulacao de bootstrap das sessoes anteriores; NAO e previsao). O veto por odds e opcional e DESLIGADO.
veto_por_odds = false      # true: bloqueia a entrada se a fracao de alvos entre os desfechos resolvidos ficar
                           # abaixo do equilibrio liquido de custos + margem (motivo rotulado "veto_por_odds")
margem_veto_odds = 0.05    # margem somada ao equilibrio liquido (fracao: 0.05 = 5 pontos percentuais)
# `robowin nucleo` (ao vivo): piscina montada do armazem de ticks (Parquet) so com pregoes ANTERIORES ao corrente e do
# mesmo ativo; mistura sintetico/real e recusada. Sem sessoes suficientes o nucleo roda SEM avaliador (motivo em
# incidentes). Ligada por padrao so como EVIDENCIA ao revisor (o veto acima continua desligado).
odds_nucleo = true
odds_nucleo_min_sessoes = 20   # minimo de sessoes completas anteriores (nunca abaixo de 20, o minimo da simulacao)
odds_nucleo_sessoes = 60       # quantas sessoes anteriores (as mais recentes) entram na piscina
odds_nucleo_dados = ""         # armazem de ticks; vazio = <[geral].dados>/ticks

[prazos]
imediato = { claude_s = 40, gpt_s = 12, validade_s = 60, desvio_max_ticks = 4 }
condicional = { expira_min_max = 10 }

[mt5]
plataforma = "mt5"      # "mt5" (B3, conta netting, livro L2, ticks em ms) | "mt4" (ponte EA: hedging, sem livro, tempo em s)
# mt4_endereco = "tcp://127.0.0.1:5560"   # endpoint ZeroMQ do EA mql4/RobowinBridge.mq4 (plataforma = "mt4")
# mt4_token = ""   # token compartilhado com o input Token do EA (ou variavel ROBOWIN_MT4_TOKEN); vazio = sem token
# login e servidor da conta DEMO (a senha vem so da variavel de ambiente ROBOWIN_MT5_SENHA)
# login = 0
# servidor = ""
# caminho_terminal = "C:/MT5/terminal64.exe"
# offset_fixo_s = 0      # use se a calibracao automatica nao for confiavel fora do pregao

[mm]
demo_mm = false   # ponte do market making para a conta demo (mm/ponte_demo.py); EXCLUSIVA com [geral].espelhar

# Exemplo de braco extra com outra IA (descomente e ajuste). O modelo precisa estar em config/modelos.toml.
