[geral]
modo = "simulacao"          # nunca "real" nesta etapa
conta = "demo_mt5"          # interno | demo_mt5
# moeda_conta = "BRL"       # opcional: moeda da conta (limites de risco nela); diferente da de lucro do simbolo sem cotacao de conversao no nucleo => entradas bloqueadas
dados = "dados_locais"
simbolo_base = "WIN"
# Espelha UM braco (id) na conta DEMO via gateway (decisao/espelho.py). Vazio = desligado (padrao).
# Exige conta = "demo_mt5", gateway no ar, conta demo zerada e SL em toda entrada; exclusivo com [mm].demo_mm.
espelhar = ""
# Limites de risco POR USUARIO e POR CONTA (risco/usuarios.py; docs/07-risco-e-operacao.md). Vazios = modo de arquivo
# unico (config/risco.toml, cuja aprovacao risco-v2 e PROVISORIA do titular, somente DEMO). Com usuario + conta, nucleo,
# gateway, espelho, MM e aceitacao usam SO os limites aprovados desse par; usuario novo comeca sem limites (bloqueado).
usuario = ""                  # ex.: "titular" (criado com `robowin usuario criar`)
conta_negociacao = ""         # PLATAFORMA:SERVIDOR:LOGIN, ex.: "mt5:CORRETORA-DEMO:123456"
usuarios = "config/usuarios"  # armazem de usuarios/contas (fora do git; relativo a raiz do projeto)

[ia]
orcamento_mensal_usd = 400
[ia.papeis.proponente]
modelo = "anthropic:claude-opus-5-5"
effort = "low"
[ia.papeis.revisor]
modelo = "openai:gpt-6.1-sol"
effort = "low"
[ia.papeis.classificador_nlp]
modelo = "anthropic:claude-haiku-5-5"
# Papeis do braco EXPERIMENTAL de debate (decisao/bracos/debate.py). So sao usados se houver um [[bracos]] com
# tipo = "debate" (desligado por padrao). Todos veem SO o dossie anonimizado: sem ferramentas e sem internet.
[ia.papeis.pesquisador]            # pesquisadores altista e baixista
modelo = "anthropic:claude-sonnet-5-5"
effort = "low"
[ia.papeis.debatedor_risco]        # debatedores de risco agressivo, neutro e conservador
modelo = "anthropic:claude-haiku-5-5"
[ia.papeis.sintetizador]           # decide depois do debate; cumpre o papel de proponente
modelo = "anthropic:claude-opus-5-5"
effort = "low"
[ia.papeis.reflexao]               # licao escrita DEPOIS do resultado liquidado (memoria reflexiva; [reflexao])
modelo = "anthropic:claude-haiku-5-5"
# Braco PLANEJADOR (docs/16-decisao-completa-ia.md): a IA devolve o plano de trade INTEIRO (PlanoTradeIA: entrar ou
# nao, lado, momento, faixa, quantidade ate o teto do envelope, stop/alvo, tempo, regras de gestao, reavaliacao). O
# codigo compila o plano e o MOTOR DE RISCO mantem o veto final. Qualquer 'provedor:modelo' serve. Padrao: os mesmos
# modelos do proponente e do revisor.
[ia.papeis.planejador]
modelo = "anthropic:claude-opus-5-5"
effort = "low"
[ia.papeis.revisor_plano]          # revisao do plano (RevisaoPlanoIA: coerente/dados_ok/regras_ok obrigatorios)
modelo = "openai:gpt-6.1-sol"
effort = "low"

[decisao]
# Maquina do Tempo (avaliacao/maquina_do_tempo.py): probabilidades do plano proposto entregues ao REVISOR como
# evidencia (simulacao de bootstrap das sessoes anteriores; NAO e previsao). O veto por odds e opcional e DESLIGADO.
veto_por_odds = false      # true: bloqueia a entrada se a fracao de alvos entre os desfechos resolvidos ficar
                           # abaixo do equilibrio liquido de custos + margem (motivo rotulado "veto_por_odds")
margem_veto_odds = 0.05    # margem somada ao equilibrio liquido (fracao: 0.05 = 5 pontos percentuais)
# `robowin nucleo` (ao vivo): piscina montada do armazem de ticks (Parquet) so com pregoes ANTERIORES ao corrente e do
# mesmo ativo; mistura sintetico/real e recusada. Sem sessoes suficientes o nucleo roda SEM avaliador (motivo em
# incidentes). Ligada por padrao so como EVIDENCIA ao revisor (o veto acima continua desligado).
odds_nucleo = true
odds_nucleo_min_sessoes = 20   # minimo de sessoes completas anteriores (nunca abaixo de 20, o minimo da simulacao)
odds_nucleo_sessoes = 60       # quantas sessoes anteriores (as mais recentes) entram na piscina
odds_nucleo_dados = ""         # armazem de ticks; vazio = <[geral].dados>/ticks

[prazos]
imediato = { claude_s = 40, gpt_s = 12, validade_s = 60, desvio_max_ticks = 4 }
condicional = { expira_min_max = 10 }
planejador = { proponente_s = 60, revisor_s = 20, expira_min_max = 10 }

# Braco PLANEJADOR (docs/16): parametros PRE-REGISTRADOS da variante (core.tipos.ConfigPlanejador). So RESTRINGEM o
# que a IA pode pedir; nunca sao limite de risco (os limites vivem SO no armazem do usuario/conta, com aprovacao por
# hash; qualquer campo de limite aqui e recusado). Mudar qualquer valor gera NOVA variante (outro hash no manifesto).
[planejador]
ativo = true
# A IA ve SO o envelope DERIVADO dos limites, em pontos/unidades/segundos (unidades maximas, stop maximo por
# quantidade, stop minimo, distancia minima de ajuste, tempo maximo, se ainda pode entrar); nunca valores em dinheiro,
# arquivos, usuario ou conta. "nenhum": so entradas_possiveis, stop_min_pontos e dist_min_ajuste_pontos.
expor_envelope = "envelope"
k_custo = 1.0                    # alvo restante > k x custo de ida e volta (estresse) + 1 tick
razao_liquida_min = 0.0          # 0 = desligado (sem geometria imposta)
max_regras = 6                   # regras de gestao por plano
tolerancia_max_ticks = 8         # faixa de execucao maxima (ticks)
tolerancia_max_fracao_stop = 0.5 # faixa de execucao maxima como fracao do stop
tempo_min_s = 30                 # tempo minimo de posicao pedido pela IA
margem_zeragem_s = 120           # a posicao tem de terminar esta margem antes da zeragem
expira_max_s = 600               # plano armado por no maximo isto
reavaliar_min_s = 10             # intervalo minimo entre reavaliacoes pedidas pela IA
passo_min_ticks = 1              # menor passo de ajuste do stop/alvo (simulacao)
passo_min_ticks_espelhado = 2    # idem no braco espelhado na DEMO
intervalo_ajuste_s = 2.0         # intervalo minimo entre ajustes automaticos de protecao
reserva_gestao_frac = 0.3
exigir_p_alvo = true             # o plano de entrada precisa declarar p_alvo (so pontuado; nunca libera nem bloqueia)

[planejador.gatilhos]
periodo_s = 240                         # chamada periodica (como os demais bracos com IA)
eventos_posicao_permitidos = ["fechou"] # eventos de posicao que chamam a IA de novo
perto_frac = 0.3                        # "perto do stop/alvo": fracao da distancia restante

[mt5]
plataforma = "mt5"      # "mt5" (B3, conta netting, livro L2, ticks em ms) | "mt4" (ponte EA: hedging, sem livro, tempo em s)
# mt4_endereco = "tcp://127.0.0.1:5560"   # endpoint ZeroMQ do EA mql4/RobowinBridge.mq4 (plataforma = "mt4")
# mt4_token = ""   # token compartilhado com o input Token do EA (ou variavel ROBOWIN_MT4_TOKEN); vazio = sem token
# login e servidor da conta DEMO (a senha vem so da variavel de ambiente ROBOWIN_MT5_SENHA)
# login = 0
# servidor = ""
# caminho_terminal = "C:/MT5/terminal64.exe"
# offset_fixo_s = 0      # use se a calibracao automatica nao for confiavel fora do pregao
# sufixo_simbolo = ""   # sufixo dos simbolos na corretora (ex.: ".m" => EURUSD.m) para `robowin perfil importar-do-terminal`

[mm]
demo_mm = false   # ponte do market making para a conta demo (mm/ponte_demo.py); EXCLUSIVA com [geral].espelhar

# Exemplo de braco extra com outra IA (descomente e ajuste). O modelo precisa estar em config/modelos.toml.
# [[bracos]]
# id = "D_exemplo"
# proponente = "anthropic:claude-sonnet-5-5"
# revisor = "openai:gpt-6.1-sol"
# modo = "condicional"

# Bracos com QUALQUER IA (desligados por padrao). Qualquer provedor de config/provedores.toml serve, e qualquer papel
# de [ia.papeis] tambem aceita 'provedor:modelo' de qualquer provedor. Antes de descomentar, cadastre o modelo:
#   robowin ia adicionar-modelo <provedor:modelo> --preco-entrada X --preco-saida Y --corte AAAA-MM-DD
# (sem preco: --preco-desconhecido; sem --corte o braco fica contaminado em qualquer backtest historico) e defina a
# chave (Windows: setx DEEPSEEK_API_KEY "..."). IDs abaixo sao EXEMPLOS: confira o id atual na documentacao do provedor.
# [[bracos]]
# id = "D_gemini"
# proponente = "google:gemini-2.5-pro"             # Gemini API (uv sync --extra google) ou "gemini_openai:..."
# revisor = "revisor"                              # papel de [ia.papeis] (padrao: GPT)
# modo = "condicional"
# [[bracos]]
# id = "D_deepseek"
# proponente = "deepseek:deepseek-chat"
# modo = "imediato"
# [[bracos]]
# id = "D_grok"
# proponente = "xai:grok-4"
# revisor = "anthropic:claude-sonnet-5-5"
# modo = "condicional"
# [[bracos]]
# id = "D_mistral"
# proponente = "mistral:mistral-large-latest"
# modo = "imediato"
# [[bracos]]
# id = "D_llama_local"
# proponente = "ollama:llama3.1:8b"                # Llama local via Ollama (sem chave; ollama pull llama3.1:8b)
# modo = "condicional"
# [[bracos]]
# id = "D_openrouter"
# proponente = "openrouter:meta-llama/llama-3.3-70b-instruct"   # uma chave, centenas de modelos
# modo = "condicional"

# Bracos do PLANEJADOR (docs/16): com [planejador].ativo, a fabrica cria as variantes pre-registradas (planejador,
# planejador_revisor, sombras e controle). Exemplo de variante extra com outro modelo (descomente e ajuste):
# [[bracos]]
# id = "planejador_sonnet"
# tipo = "planejador"
# proponente = "anthropic:claude-sonnet-5-5"   # papel (ou provedor:modelo) que cumpre o papel de planejador
# [[bracos]]
# id = "planejador_revisor_gemini"
# tipo = "planejador"
# proponente = "planejador"                    # papel de [ia.papeis]
# revisor = "google:gemini-2.5-pro"            # opcional: plano + revisao (analogo do C; papel revisor_plano)

# Braco EXPERIMENTAL de debate (pesquisadores altista/baixista + debate de risco + sintetizador). Desligado por
# padrao; so existe no modo condicional (latencia). A saida e uma proposta comum: mesmos validadores, revisor
# (se houver) e o MESMO veto final do motor de risco. Entra no manifesto e na correcao de Holm como qualquer braco.
# [[bracos]]
# id = "debate_cond"
# tipo = "debate"
# proponente = "sintetizador"        # papel (ou provedor:modelo) do sintetizador
# pesquisador = "pesquisador"        # padrao: o proponente
# debatedor_risco = "debatedor_risco"  # padrao: o proponente
# revisor = "revisor"                # opcional: debate + revisor (analogo do C)
# modo = "condicional"
# rodadas = 1                        # 1 ou 2
# veto_unanime_risco = true

# Memoria reflexiva (ia/reflexao.py): reflexoes escritas SO depois do resultado liquidado e injetadas no dossie
# apenas apos o instante em que ficam disponiveis (t_disponivel). Desligada por padrao.
[reflexao]
ativo = false
papel = "reflexao"        # papel de [ia.papeis]
atraso_liquidacao_s = 300 # a reflexao so e pedida depois deste atraso apos a saida da operacao
max_reflexoes = 3         # quantas reflexoes entram no dossie (as mais recentes disponiveis)

# Negocios intradiarios PUBLICOS da B3 (`robowin dados baixar-b3` / `importar-b3`; dados/b3_negocios.py).
# Um ZIP por contrato e pregao, com um .txt separado por ';' e decimal ','. So os ultimos ~20-30 pregoes ficam
# disponiveis. Nao ha lado agressor nem livro: o lado e INFERIDO pela regra do tick e rotulado como tal.
[dados_b3]
url_negocios = "https://arquivos.b3.com.br/rapinegocios/tickercsv/{ticker}/{data}"  # {ticker} e {data} (AAAA-MM-DD)
tentativas = 5             # novas tentativas por pregao (a conexao as vezes cai no meio do ZIP de ~40 MB)
espera_inicial_s = 5       # espera antes da 2a tentativa; dobra a cada nova tentativa
timeout_s = 300
cache = ""                 # vazio = <[geral].dados>/b3/negocios
fuso_utc_horas = -3        # HoraFechamento vem no horario de Brasilia (UTC-3, sem horario de verao)
atraso_entrega_ms = 50     # t_disponivel = t_evento + este atraso (entrega do dado ao robo); conservador > 0
agregacao = "ms_preco"     # "ms_preco" (soma o volume dos negocios do mesmo ms e preco) | "nenhuma"

# Simulacao historica walk-forward causal (`robowin historico`; historico/).
[historico]
compactar_ms = 1000        # corridas de mesmo preco/lado: 1o negocio no instante exato, o resto somado no instante
                           # do ultimo (no maximo esta janela). 0 = sem compactacao (lento: milhoes de eventos/dia)
dias_treino = 5            # pregoes ANTERIORES usados no treino do modelo quant de cada dia (sem busca de parametros)
periodo_ia_s = 240         # gatilho periodico dos bracos com IA (como no `simular`)
idade_max_dado_s = 15      # dado mais velho que isto bloqueia entradas (igual ao nucleo ao vivo)
