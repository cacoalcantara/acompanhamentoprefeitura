# revisor = "openai:gpt-6.1-sol"
# modo = "condicional"

# Bracos com QUALQUER IA (desligados por padrao). Qualquer provedor de config/provedores.toml serve, e qualquer papel
# de [ia.papeis] tambem aceita 'provedor:modelo' de qualquer provedor. Antes de descomentar, cadastre o modelo:
#   robowin ia adicionar-modelo <provedor:modelo> --preco-entrada X --preco-saida Y --corte AAAA-MM-DD
# (sem preco: --preco-desconhecido; sem --corte o braco fica contaminado em qualquer backtest historico) e defina a
# chave (Windows: setx DEEPSEEK_API_KEY "..."). IDs abaixo sao EXEMPLOS: confira o id atual na documentacao do provedor.
# [[bracos]]
# id = "D_gemini"
# proponente = "google:gemini-2.5-pro"             # Gemini API (uv sync --extra google) ou "gemini_openai:..."
# revisor = "revisor"                              # papel de [ia.papeis] (padrao: GPT)
# modo = "condicional"
# [[bracos]]
# id = "D_deepseek"
# proponente = "deepseek:deepseek-chat"
# modo = "imediato"
# [[bracos]]
# id = "D_grok"
# proponente = "xai:grok-4"
# revisor = "anthropic:claude-sonnet-5-5"
# modo = "condicional"
# [[bracos]]
# id = "D_mistral"
# proponente = "mistral:mistral-large-latest"
# modo = "imediato"
# [[bracos]]
# id = "D_llama_local"
# proponente = "ollama:llama3.1:8b"                # Llama local via Ollama (sem chave; ollama pull llama3.1:8b)
# modo = "condicional"
# [[bracos]]
# id = "D_openrouter"
# proponente = "openrouter:meta-llama/llama-3.3-70b-instruct"   # uma chave, centenas de modelos
# modo = "condicional"

# Braco EXPERIMENTAL de debate (pesquisadores altista/baixista + debate de risco + sintetizador). Desligado por
# padrao; so existe no modo condicional (latencia). A saida e uma proposta comum: mesmos validadores, revisor
# (se houver) e o MESMO veto final do motor de risco. Entra no manifesto e na correcao de Holm como qualquer braco.
# [[bracos]]
# id = "debate_cond"
# tipo = "debate"
# proponente = "sintetizador"        # papel (ou provedor:modelo) do sintetizador
# pesquisador = "pesquisador"        # padrao: o proponente
# debatedor_risco = "debatedor_risco"  # padrao: o proponente
# revisor = "revisor"                # opcional: debate + revisor (analogo do C)
# modo = "condicional"
# rodadas = 1                        # 1 ou 2
# veto_unanime_risco = true

# Memoria reflexiva (ia/reflexao.py): reflexoes escritas SO depois do resultado liquidado e injetadas no dossie
# apenas apos o instante em que ficam disponiveis (t_disponivel). Desligada por padrao.
[reflexao]
ativo = false
papel = "reflexao"        # papel de [ia.papeis]
atraso_liquidacao_s = 300 # a reflexao so e pedida depois deste atraso apos a saida da operacao
max_reflexoes = 3         # quantas reflexoes entram no dossie (as mais recentes disponiveis)

# Negocios intradiarios PUBLICOS da B3 (`robowin dados baixar-b3` / `importar-b3`; dados/b3_negocios.py).
# Um ZIP por contrato e pregao, com um .txt separado por ';' e decimal ','. So os ultimos ~20-30 pregoes ficam
# disponiveis. Nao ha lado agressor nem livro: o lado e INFERIDO pela regra do tick e rotulado como tal.
[dados_b3]
url_negocios = "https://arquivos.b3.com.br/rapinegocios/tickercsv/{ticker}/{data}"  # {ticker} e {data} (AAAA-MM-DD)
tentativas = 5             # novas tentativas por pregao (a conexao as vezes cai no meio do ZIP de ~40 MB)
espera_inicial_s = 5       # espera antes da 2a tentativa; dobra a cada nova tentativa
timeout_s = 300
cache = ""                 # vazio = <[geral].dados>/b3/negocios
fuso_utc_horas = -3        # HoraFechamento vem no horario de Brasilia (UTC-3, sem horario de verao)
atraso_entrega_ms = 50     # t_disponivel = t_evento + este atraso (entrega do dado ao robo); conservador > 0
agregacao = "ms_preco"     # "ms_preco" (soma o volume dos negocios do mesmo ms e preco) | "nenhuma"

# Simulacao historica walk-forward causal (`robowin historico`; historico/).
[historico]
compactar_ms = 1000        # corridas de mesmo preco/lado: 1o negocio no instante exato, o resto somado no instante
                           # do ultimo (no maximo esta janela). 0 = sem compactacao (lento: milhoes de eventos/dia)
dias_treino = 5            # pregoes ANTERIORES usados no treino do modelo quant de cada dia (sem busca de parametros)
periodo_ia_s = 240         # gatilho periodico dos bracos com IA (como no `simular`)
idade_max_dado_s = 15      # dado mais velho que isto bloqueia entradas (igual ao nucleo ao vivo)
