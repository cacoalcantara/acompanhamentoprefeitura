# Fontes de noticias e calendario de eventos agendados.
# TODAS as URLs e datas abaixo estao marcadas verificado = false: foram escritas de memoria e PRECISAM ser
# conferidas pelo usuario nos sites oficiais. Fonte de noticias nao verificada fica DESLIGADA.
# Eventos do calendario nao verificados continuam bloqueando entradas (falha segura).

[[fonte]]
tipo = "rss"
nome = "fed_comunicados"
url = "https://www.federalreserve.gov/feeds/press_all.xml"
fuso_origem = "America/New_York"
verificado = false

[[fonte]]
tipo = "rss"
nome = "bcb_notas"
url = "https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/notas"
fuso_origem = "America/Sao_Paulo"
verificado = false

[[fonte]]
tipo = "rss"
nome = "ibge_agencia_noticias"
url = "https://agenciadenoticias.ibge.gov.br/agencia-rss.xml"
fuso_origem = "America/Sao_Paulo"
verificado = false

[[fonte]]
tipo = "http_json"
nome = "exemplo_json"
url = "https://example.invalid/noticias.json"
fuso_origem = "America/Sao_Paulo"
campo_lista = "itens"
campo_titulo = "titulo"
campo_data = "publicado_em"
campo_id = "id"
verificado = false

