# Perfis de BOLSA: fuso, calendario (codigo do exchange-calendars), sessoes versionadas, moeda, modelo de tarifas,
# limites de oscilacao opcionais e regime tributario. Cada ativo de config/instrumentos.toml aponta para uma bolsa
# (`bolsa = "B3"` por padrao). Trocar de bolsa = apontar o ativo para outra secao daqui.
#
# So a B3 esta preenchida e confirmada. As demais sao MODELOS a_confirmar = true: bloqueiam a operacao (e a
# conexao ao MT5) ate o usuario conferir TODOS os itens e confirmar com
#   uv run robowin perfil confirmar bolsa:<CODIGO> --responsavel "<seu nome>" --fonte "<fonte>"
# (campos opcionais fonte, fonte_data, confirmado_por e confirmado_em registram a proveniencia). Hoje a simulacao sintetica
# usa o fuso/calendario da B3 para o relogio interno; ver docs/03 para esse limite.
#
# regime_tributario: brasil_day_trade (IR 20% + IRRF 1%, implementado em avaliacao/impostos.py) | nao_calculado
#   (qualquer outro regime: o relatorio diz "tributo nao calculado"; nenhum imposto e inventado).

[B3]
nome = "B3 - Brasil, Bolsa, Balcao"
fuso = "America/Sao_Paulo"
calendario = "BVMF"
moeda = "BRL"
modelo_tarifas = "por_lado_por_lote"
regime_tributario = "brasil_day_trade"
a_confirmar = false
a_confirmar_itens = []
[[B3.sessoes]]
