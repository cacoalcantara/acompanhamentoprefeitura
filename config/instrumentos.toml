# Perfis de instrumento: TROCAR O ATIVO = editar [geral].simbolo_base em config/robowin.toml (ou usar --ativo).
# Nenhum numero de ativo vive no codigo: tick, valor do ponto, lote, tarifas, vencimento, limites em TICKS e sessao
# saem daqui. Para um ativo novo, copie o perfil mais parecido, mude o nome da secao e confirme cada valor.
#
# a_confirmar = true  -> valor SEM fonte confirmada (suposicao ou placeholder). FALHA SEGURA: o perfil BLOQUEIA
#   gateway, nucleo ao vivo, conexao ao MT5 e qualquer ordem. So a SIMULACAO sobre dados SINTETICOS roda, e o
#   resultado e rotulado `ativo_a_confirmar`. Depois de conferir TODOS os itens de `a_confirmar_itens` na
#   especificacao da B3 e da corretora, troque para a_confirmar = false (e esvazie a lista).
#
# Campos:
#   bolsa: chave de config/bolsas.toml (padrao B3); moeda, fuso, calendario e sessoes vem de la
#   classe: futuro_indice | futuro_cambio | acao | etf
#   vencimento: quarta_dia15_meses_pares | primeiro_dia_util_mes | nenhum
#   ponto_valor_brl: R$ por ponto de cotacao por lote (1 lote = `lote` unidades; o volume enviado = quantidade*lote)
#   tick_pontos: variacao minima de preco em pontos de cotacao
#   stop_max_ticks / slippage_folga_ticks / stop_padrao_ticks / alvo_padrao_ticks: limites em TICKS (nunca em pontos)
#   risco_aprovado_padrao: true so quando config/risco.toml (travado por hash) foi aprovado PARA este ativo
#   preco_sintetico_ref: nivel de preco dos dados sinteticos (nao e dado de mercado)

