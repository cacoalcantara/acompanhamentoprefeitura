# ======================================================================================================================
# QUALQUER MERCADO DO MT4/MT5 (forex, metais, indices e acoes CFD, commodities, cripto): MODELOS de exemplo, todos
# a_confirmar = true (valores tipicos de mercado, NAO lidos da sua corretora). O caminho certo e gerar o perfil a partir
# do SEU terminal e depois confirmar:
#   uv run robowin perfil importar-do-terminal EURUSD [--plataforma mt4|mt5]   (le symbol_info; grava a_confirmar)
#   uv run robowin perfil confirmar EURUSD --responsavel "<seu nome>" --fonte "<fonte>" --comparar-terminal
# Campos do modelo generico (opcionais; os perfis B3 acima nao os usam):
#   classe: forex | cfd_indice | cfd_acao | metal | commodity | cripto | futuro (alem das da B3)
#   bolsa: FOREX | CFD | CRIPTO (config/bolsas.toml: sessao 24x5/24x7, rollover, pausas, dias fechados)
#   modo_calculo: forex | cfd | futuros | bolsa (trade_calc_mode do terminal; vazio = o da classe)
#   tamanho_contrato (trade_contract_size), volume_min / volume_step / volume_max (lotes do terminal; a UNIDADE do robo
#   e o lote minimo: quantidade 1 = volume_min), digitos, ponto, pip (so exibicao), tick_pontos (trade_tick_size)
#   tick_valor_lucro: valor de 1 tick por 1,0 lote NA MOEDA DE LUCRO (com conta na mesma moeda = trade_tick_value;
#     com conta em outra moeda o terminal informa o valor JA convertido: o importador usa tick_size x contract_size)
#   ponto_valor_brl: omitido => derivado (tick_valor_lucro / tick_pontos x volume_min), na moeda de lucro
#   moeda_base / moeda_cotacao / moeda_lucro / moeda_margem; P&L e risco sao convertidos para a MOEDA DA CONTA pela
#     cotacao do par de conversao lida no mesmo instante (sem cotacao => entradas bloqueadas)
#   swap_long / swap_short (convencao do MT: positivo = credito), swap_modo (pontos | moeda_lucro | moeda_conta),
#   swap_dia_triplo (segunda..domingo), spread_tipico_pontos, comissao_lote_lado (por 1,0 lote por lado, na moeda de
#   lucro; a confirmar com a corretora), simbolo_corretora (nome exato no terminal, ex.: com sufixo ".m")
#   tarifas: dispensadas nas classes de corretora (sem tarifa de bolsa)

[EURUSD]
classe = "forex"
bolsa = "FOREX"
descricao = "MODELO forex: euro x dolar (5 digitos)"
modo_calculo = "forex"
tamanho_contrato = 100000.0
volume_min = 0.01
volume_step = 0.01
volume_max = 100.0
digitos = 5
ponto = 0.00001
pip = 0.0001
tick_pontos = 0.00001
tick_valor_lucro = 1.0        # 100000 x 0,00001 = USD 1 por tick por lote
moeda_base = "EUR"
moeda_cotacao = "USD"
moeda_lucro = "USD"
moeda_margem = "EUR"
swap_dia_triplo = "quarta"
stop_max_ticks = 300
slippage_folga_ticks = 20
stop_padrao_ticks = 100
alvo_padrao_ticks = 100
aceita_book = false
risco_aprovado_padrao = false
preco_sintetico_ref = 1.10
a_confirmar = true
a_confirmar_itens = ["especificacao da SUA corretora (importe com `robowin perfil importar-do-terminal EURUSD`)",
                     "swap_long/swap_short e modo (nao informados aqui)", "comissao por lote (nao informada)",
                     "spread tipico", "volume_max", "limites em ticks", "sufixo do simbolo na corretora"]

